<style>
/* Layout: one column of "Lernkarten" on squared school-notebook paper; unit badges echo the book's orange corner tag */
:root{

  --bg:#14171C; --grid:#1B1F25; --surface:#1E232B; --ink:#E8EBEF; --muted:#9AA3B0; --line:#2F3641;
  --accent:#FF8C3A; --accent-ink:#1A0E04; --accent-soft:#3A2516;
  --der:#79A6FF; --das:#5CCB8A; --die:#FF7D72;
  --ok:#4FCBA9; --ok-soft:#173A32; --bad:#FF8A73; --bad-soft:#41231D; --warn:#E8B84A; --warn-soft:#3A3018;

/* Lesson */

.sentence{font-size:1.4rem;font-weight:500;line-height:1.6}
.sentence .blank{display:inline-block;min-width:4em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
input.answer{width:100%;font:inherit;font-size:1.35rem;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.answer:focus{border-color:var(--accent);outline:none}
input.answer.ok{border-color:var(--ok)} input.answer.no{border-color:var(--bad)}
.keys{display:flex;gap:8px;flex-wrap:wrap}
.key{min-width:52px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.25rem;font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px}

.reading{font-size:1.12rem;line-height:1.7;white-space:pre-line;background:var(--bg);border-radius:12px;padding:14px 16px}
.rule{display:flex;flex-direction:column;gap:12px;font-size:1.02rem}
.rule p{margin:0}

.rule .ex{background:var(--bg);border-radius:10px;padding:10px 14px;line-height:1.7}
.rule table{border-collapse:collapse;font-size:.98rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.rule td,.rule th{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rule th{color:var(--muted);font-weight:600}
.hl{color:var(--accent);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 160px}

/* Feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  border-top:2px solid var(--line);background:var(--surface)}
.sheet .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet.ok{background:var(--ok-soft);border-color:var(--ok)}
.sheet.bad{background:var(--bad-soft);border-color:var(--bad)}
.sheet.warn{background:var(--warn-soft);border-color:var(--warn)}
.sheet .head{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.sheet.ok .head{color:var(--ok)} .sheet.bad .head{color:var(--bad)} .sheet.warn .head{color:var(--warn)}
.sheet .right{font-size:1.25rem;font-weight:600}
.sheet{max-height:75vh;overflow-y:auto}
.pairline{display:flex;align-items:center;gap:10px}
.say.mini{padding:6px 10px;min-height:40px}
.trline .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-right:6px}
.rulebox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.rulebox summary{cursor:pointer;font-weight:600;color:var(--accent)}
.rulebox .rule{margin-top:10px}

/* Word list */
.wl{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wl button{display:flex;gap:12px;align-items:baseline;padding:12px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.wl button:first-child{border-top:0}
.wl .w{font-weight:600;flex:1 1 50%;min-width:0;word-break:break-word}
.wl .r{color:var(--muted);flex:1 1 50%;min-width:0}
.stats{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile-s{background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.tile-s .k{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.tile-s .v{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.forecast{font-size:.95rem}
.lrow{border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .lesson{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px 52px}
.chip{min-width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-variant-numeric:tabular-nums}
.chip.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.mid{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.vsel{flex:1 1 200px;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
.save{font-size:.9rem;border-radius:10px;padding:10px 12px;background:var(--bg)}
.save.ok{background:var(--ok-soft);color:var(--ok)}
.save.warn{background:var(--warn-soft);color:var(--warn)}
.result{font-family:var(--f-display);font-size:2.6rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
@media (max-width:480px){.de{font-size:1.45rem}.de.big{font-size:1.8rem}.sentence{font-size:1.2rem}h1{font-size:1.35rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";
/* ---------- storage ---------- */
var KEY='primaplus-a11-v1';
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
var DB=load()||{progress:{},mistakes:[],minutes:{}};
DB.progress=DB.progress||{};DB.mistakes=DB.mistakes||[];DB.minutes=DB.minutes||{};
var CLOUDREF=null,cloudTimer=null,cloudState='checking';
var STANDALONE=!(window.claude&&typeof window.claude.use==='function');
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
  if(CLOUDREF&&cloudState==='cloud'){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,1500)}}
function cloudPush(){if(!CLOUDREF)return Promise.resolve();return CLOUDREF.set({state:JSON.stringify(DB),updated:Date.now()}).catch(function(e){if(e&&e.code==='invalid_argument'){cloudState='denied';rerenderHome()}})}
function mergeDB(a,b){var o={progress:{},minutes:{},mistakes:[],start:null};
  [a,b].forEach(function(d){if(!d)return;var k;
    for(k in d.progress||{}){var p=d.progress[k],q=o.progress[k];if(p&&(!q||(p.best||0)>(q.best||0)))o.progress[k]={best:p.best,last:p.last}}
    for(k in d.minutes||{})o.minutes[k]=Math.max(o.minutes[k]||0,d.minutes[k]||0);
    if(d.start&&(!o.start||d.start<o.start))o.start=d.start});
  o.mistakes=(a&&a.mistakes&&a.mistakes.length)?a.mistakes:((b&&b.mistakes)||[]);
  if(!o.start)delete o.start;return o}
function rerenderHome(){if(S&&S.view==='home'){var y=window.scrollY;home();window.scrollTo(0,y)}}
function cloudInit(){
  var C=window.claude;if(!C||typeof C.use!=='function'){cloudState='local';rerenderHome();return}
  Promise.all([C.use('db'),C.use('user')]).then(function(r){var db=r[0],u=r[1];if(!db||!u){cloudState='local';rerenderHome();return null}
    return u.id().then(function(id){if(!id){cloudState='local';rerenderHome();return null}
      CLOUDREF=db.doc('data/users/'+id+'/prima');
      return CLOUDREF.get().then(function(snap){var remote=null;try{remote=snap.exists&&snap.data().state?JSON.parse(snap.data().state):null}catch(e){}
        var m=mergeDB(DB,remote);DB.progress=m.progress;DB.minutes=m.minutes;DB.mistakes=m.mistakes;if(m.start)DB.start=m.start;
        cloudState='cloud';try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
        rerenderHome();return cloudPush()})})}).catch(function(){cloudState='local';rerenderHome()})}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

/* ---------- speech ---------- */
var deVoice=null,DEVOICES=[];
function vq(v){var t=(v.name+' '+v.voiceURI).toLowerCase();return /premium/.test(t)?3:/enhanced|erweitert|neural|natural|online/.test(t)?2:v.localService?1:0}
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  DEVOICES=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().replace('_','-').indexOf('de')===0});
  var want=null;try{want=localStorage.getItem('primaplus-voice')}catch(e){}
  deVoice=(want&&DEVOICES.find(function(v){return v.voiceURI===want}))||DEVOICES.slice().sort(function(a,b){return vq(b)-vq(a)||(/anna/i.test(b.name)?1:0)-(/anna/i.test(a.name)?1:0)})[0]||null;
  var sel=document.getElementById('voiceSel');if(sel)fillVoices(sel);
}
function fillVoices(sel){sel.innerHTML=DEVOICES.length?DEVOICES.map(function(v){return '<option value="'+esc(v.voiceURI)+'"'+(deVoice&&v.voiceURI===deVoice.voiceURI?' selected':'')+'>'+esc(v.name)+(vq(v)>=2?' ★':'')+'</option>'}).join(''):'<option>Немецкие голоса не найдены</option>'}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,800)}
var slowNext=false;
var ttsPrimed=false;
function primeTTS(){if(ttsPrimed||!('speechSynthesis' in window))return;ttsPrimed=true;
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='de-DE';speechSynthesis.speak(u)}catch(e){}}
document.addEventListener('touchend',primeTTS,{once:true,passive:true});
document.addEventListener('click',primeTTS,{once:true});
function say(text,slow){
  if(!('speechSynthesis' in window)||!text)return;
  try{
    if(!deVoice||!DEVOICES.length)pickVoice();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=deVoice&&deVoice.lang?deVoice.lang:'de-DE'; if(deVoice)u.voice=deVoice;
    u.rate=slow?0.6:0.88;u.volume=1;u.pitch=1;
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(function(){try{speechSynthesis.speak(u)}catch(e){}},120)}
    else speechSynthesis.speak(u);
    if(speechSynthesis.paused)speechSynthesis.resume();
  }catch(e){}
}
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
var SNAIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a,n){return shuffle(a).slice(0,n)}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function colorArt(s){return esc(s).replace(/(^|[\s(])(der|das|die)(\s)/g,function(m,p,a,sp){return p+'<span class="art-'+a+'">'+a+'</span>'+sp})}
function norm(s){return String(s).replace(/[’`´]/g,"'").replace(/[.,!?;:¿¡"«»]/g,'').replace(/\s+/g,' ').trim()}
function deUml(s){return s.replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'s').replace(/Ä/g,'A').replace(/Ö/g,'O').replace(/Ü/g,'U')}
function translit(s){return s.replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')}
function lev(a,b){var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[i]}for(var j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
/* returns {res:'ok'|'near'|'no', msg, best} */
function check(input,answers){
  var x=norm(input); if(!x)return{res:'empty'};
  var best=answers[0];
  for(var i=0;i<answers.length;i++){if(x===norm(answers[i]))return{res:'ok',best:answers[i]}}
  for(i=0;i<answers.length;i++){var a=norm(answers[i]);
    if(x.toLowerCase()===a.toLowerCase())return{res:'ok',best:answers[i],msg:'Проверь большие буквы. В немецком с большой буквы пишутся имена, все существительные и вежливое Sie.'}}
  for(i=0;i<answers.length;i++){a=norm(answers[i]);
    if(translit(x.toLowerCase())===translit(a.toLowerCase()))return{res:'ok',best:answers[i],msg:'Засчитано. Но лучше пиши настоящими буквами ä, ö, ü, ß: кнопки под полем ввода.'}}
  for(i=0;i<answers.length;i++){a=norm(answers[i]);
    if(deUml(x.toLowerCase())===deUml(a.toLowerCase()))return{res:'no',best:answers[i],msg:'Почти! Не хватает буквы с точками (ä, ö, ü) или ß.'}}
  for(i=0;i<answers.length;i++){a=norm(answers[i]);

  return{res:'no',best:best};
}

  RULE('Три вопроса при знакомстве','<div class="ex"><b>Wie heißt du?</b> — Как тебя зовут? → <b>Ich heiße Carla.</b> или <b>Ich bin Carla.</b><br><b>Woher kommst du?</b> — Откуда ты? → <b>Ich komme aus Spanien.</b><br><b>Wo wohnst du?</b> — Где ты живёшь? → <b>Ich wohne in Köln.</b></div><p>Не перепутай: <b>wo</b> — где, <b>woher</b> — откуда, <b>wie</b> — как.</p><p>После <b>aus</b> — откуда ты родом. После <b>in</b> — где живёшь сейчас.</p><p>Глагол меняет окончание: с <b>ich</b> — <span class="hl">-e</span>, с <b>du</b> — <span class="hl">-st</span>.</p><div class="ex">ich komm<span class="hl">e</span> · du komm<span class="hl">st</span><br>ich wohn<span class="hl">e</span> · du wohn<span class="hl">st</span><br>ich heiß<span class="hl">e</span> · du heiß<span class="hl">t</span> (тут только -t: ß уже звучит как «с»)<br>ich <b>bin</b> · du <b>bist</b> (глагол sein — «быть»)</div><p>В вопросе со словом <b>wie / wo / woher</b> глагол стоит <b>вторым</b>: Wo <u>wohnst</u> du?</p>'),

 {id:'u1l3',title:'Алфавит и буквы с точками',items:[
  RULE('Как называются буквы','<p>Немцы часто просят продиктовать имя по буквам: <b>Wie schreibt man das?</b> — Как это пишется? Если не расслышала: <b>Wie bitte?</b> — Что, простите?</p><p>Большинство букв звучат почти как по-русски, но эти легко перепутать:</p><div class="tablewrap"><table><tr><th>буква</th><th>как называется</th></tr><tr><td>E</td><td>«э»</td></tr><tr><td>H</td><td>«ха»</td></tr><tr><td>I</td><td>«и»</td></tr><tr><td>J</td><td>«йот»</td></tr><tr><td>V</td><td>«фау»</td></tr><tr><td>W</td><td>«вэ»</td></tr><tr><td>Y</td><td>«ипсилон»</td></tr><tr><td>Z</td><td>«цэт»</td></tr></table></div><p>И ещё четыре особые буквы: <b>ä, ö, ü</b> (Umlaute — «а, о, у с точками») и <b>ß</b> («эсцет», звучит как «сс»). Например: <b>Köln</b>, <b>München</b>, <b>Tschüs</b>, <b>heißen</b>, <b>Fußball</b>.</p><p>В заданиях под полем ввода есть кнопки <b>ä ö ü ß</b>.</p>'),

 {id:'u1l4',title:'Вежливо: Sie',items:[
  RULE('du или Sie','<p><b>du</b> — «ты»: друзьям, одноклассникам, семье.</p><p><b>Sie</b> — «Вы»: учителям и незнакомым взрослым. Пишется <b>всегда с большой буквы</b>.</p><p>С <b>Sie</b> глагол выглядит как в словаре, на <span class="hl">-en</span>:</p><div class="ex">du heißt → Sie heiß<span class="hl">en</span><br>du wohnst → Sie wohn<span class="hl">en</span><br>du kommst → Sie komm<span class="hl">en</span><br>du bist → Sie <b>sind</b></div><div class="ex"><b>Wie heißen Sie?</b> — Как Вас зовут?<br><b>Wie geht es Ihnen?</b> — Как у Вас дела?<br><b>Herr</b> Lohbach — господин Лобах, <b>Frau</b> Meier — госпожа Майер</div><p>Слова из анкеты (<b>Anmeldung</b>): <b>Vorname</b> — имя, <b>Familienname</b> — фамилия, <b>Straße</b> — улица, <b>Wohnort</b> — город, где живёшь, <b>Land</b> — страна.</p>'),

 {id:'u1l5',title:'Что ты любишь?',items:[
  RULE('Глагол mögen — «любить, нравиться»','<div class="ex">ich <b>mag</b> · du <b>magst</b> · Sie <b>mögen</b></div><p><b>Ich mag Tennis.</b> — Я люблю теннис.<br><b>Ich mag Judo und Schwimmen.</b> — Я люблю дзюдо и плавание.<br><b>Ich mag auch Musik.</b> — Я ещё люблю музыку. (auch — тоже, ещё)</p><p>Два вида вопросов:</p><div class="ex"><b>Was magst du?</b> — Что ты любишь? (с вопросительным словом глагол <b>второй</b>)<br><b>Magst du Fußball?</b> — Ты любишь футбол? (вопрос «да/нет» — глагол <b>первый</b>)<br>Ответ: <b>Ja, sehr.</b> — Да, очень. / <b>Nein.</b> — Нет.</div>'),

{n:2,title:'Meine Klasse',ru:'Мой класс',pages:'с. 13–20',lessons:[
 {id:'u2l1',title:'Числа 0–20',items:[
  RULE('Считаем до 20','<div class="tablewrap"><table><tr><td>0 null</td><td>5 fünf</td><td>10 zehn</td><td>15 fünfzehn</td></tr><tr><td>1 eins</td><td>6 sechs</td><td>11 elf</td><td>16 <b>sech</b>zehn</td></tr><tr><td>2 zwei</td><td>7 sieben</td><td>12 zwölf</td><td>17 <b>sieb</b>zehn</td></tr><tr><td>3 drei</td><td>8 acht</td><td>13 dreizehn</td><td>18 achtzehn</td></tr><tr><td>4 vier</td><td>9 neun</td><td>14 vierzehn</td><td>19 neunzehn</td></tr></table></div><p>20 — <b>zwanzig</b>.</p><p>13–19 строятся как в русском: «три-на-дцать» = <b>drei</b> + <b>zehn</b>. Две ловушки: 16 — <b>sechzehn</b> (без s), 17 — <b>siebzehn</b> (без en).</p><p>Как читать: <b>ei</b> = «ай» (zwei, drei), <b>ie</b> = долгое «и» (vier, sieben), <b>z</b> = «ц» (zehn), <b>v</b> = «ф» (vier).</p><p><b>Wie ist deine Handynummer?</b> — Какой у тебя номер телефона? Номер диктуют по одной цифре.</p>'),
  L('eins, zwei, drei, vier, fünf','1, 2, 3, 4, 5'),L('sechs, sieben, acht, neun, zehn','6, 7, 8, 9, 10'),L('elf, zwölf','11, 12'),L('sechzehn, siebzehn','16, 17 — запомни написание'),L('zwanzig','20'),
  GEN('numHear',{min:0,max:20,n:6}),
  GEN('numWrite',{min:0,max:12,n:3}),
  GEN('numWrite',{min:13,max:20,n:3}),
  C('Как пишется 16?',['sechzehn','sechszehn','sechzen'],'sechzehn',{sayAnswer:'sechzehn'}),
  C('Как пишется 17?',['siebzehn','siebenzehn','sibzehn'],'siebzehn',{sayAnswer:'siebzehn'}),
  D('null, eins, sechs, vier, fünf, sieben, sieben','0164577','Это номер телефона. Напиши цифрами.',{digits:true,slow:true}),
  D('null, eins, fünf, sieben, drei, acht, zwei','0157382','Ещё один номер. Напиши цифрами.',{digits:true,slow:true}),

 {id:'u2l2',title:'Числа до 1000',items:[
  RULE('Десятки, сотни и «наоборот»','<div class="tablewrap"><table><tr><td>30 drei<b>ß</b>ig</td><td>40 vierzig</td><td>50 fünfzig</td></tr><tr><td>60 <b>sech</b>zig</td><td>70 <b>sieb</b>zig</td><td>80 achtzig</td></tr><tr><td>90 neunzig</td><td>100 (ein)hundert</td><td>1000 (ein)tausend</td></tr></table></div><p>Главное правило: от 21 до 99 сначала говорят <b>единицы</b>, потом <b>десятки</b>, а между ними <b>und</b> («и»):</p><div class="ex">21 = <b>ein</b>und<b>zwanzig</b> («один-и-двадцать»)<br>35 = <b>fünf</b>und<b>dreißig</b><br>99 = <b>neun</b>und<b>neunzig</b></div><p>Всё число пишется <b>одним словом</b>.</p><p>Сотни просто ставят впереди: 200 = <b>zweihundert</b>, 101 = <b>hunderteins</b>, 345 = <b>dreihundertfünfundvierzig</b>.</p><p>Ловушка на слух: 23 (dreiundzwanzig) и 32 (zweiunddreißig) легко перепутать. Первая цифра, которую слышишь, — последняя в записи.</p>'),
  L('einundzwanzig','21'),L('zweiunddreißig','32'),L('fünfundvierzig','45'),L('hundert','100'),L('dreihundertfünfundvierzig','345'),
  O('Собери число 45',' fünfundvierzig',{tiles:['fünf','und','vierzig','vier'],join:true,a:'fünfundvierzig'}),
  O('Собери число 23',' dreiundzwanzig',{tiles:['drei','und','zwanzig','dreißig'],join:true,a:'dreiundzwanzig'}),

 {id:'u2l5',title:'Глаголы целиком',items:[
  RULE('Все лица глагола','<p>Теперь вся таблица. Окончания одинаковые почти у всех глаголов:</p><div class="tablewrap"><table><tr><th></th><th>окончание</th><th>wohnen</th><th>sein</th><th>mögen</th></tr><tr><td>ich — я</td><td>-e</td><td>wohne</td><td>bin</td><td>mag</td></tr><tr><td>du — ты</td><td>-st</td><td>wohnst</td><td>bist</td><td>magst</td></tr><tr><td>er/sie/es — он/она/оно</td><td>-t</td><td>wohnt</td><td>ist</td><td>mag</td></tr><tr><td>wir — мы</td><td>-en</td><td>wohnen</td><td>sind</td><td>mögen</td></tr><tr><td>ihr — вы (друзья)</td><td>-t</td><td>wohnt</td><td>seid</td><td>mögt</td></tr><tr><td>sie — они</td><td>-en</td><td>wohnen</td><td>sind</td><td>mögen</td></tr><tr><td>Sie — Вы</td><td>-en</td><td>wohnen</td><td>sind</td><td>mögen</td></tr></table></div><p><b>sie</b> может значить «она», «они» или «Вы». Подсказка — глагол: <b>sie wohnt</b> = она, <b>sie wohnen</b> = они, <b>Sie wohnen</b> (с большой) = Вы.</p><p><b>ihr</b> — это «вы», когда говоришь нескольким друзьям: <b>Was macht ihr?</b> — Что вы делаете?</p>'),

 {id:'u2l6',title:'Школьные вещи: der, das, die',items:[
  RULE('Артикль — часть слова','<p>У каждого немецкого существительного есть артикль:</p><div class="ex"><span class="art-der"><b>der</b></span> — мужской род · <span class="art-das"><b>das</b></span> — средний · <span class="art-die"><b>die</b></span> — женский</div><p>Род часто <b>не совпадает</b> с русским: <span class="art-das">das</span> Buch (а «книга» — женского рода), <span class="art-die">die</span> Schere (а «ножницы» — вообще множественное число).</p><p>Поэтому слово учат сразу с артиклем, как одно целое: не «Kuli», а «<span class="art-der">der</span> Kuli». Цвета здесь как в учебнике: der — синий, das — зелёный, die — красный.</p><p>Существительные в немецком <b>всегда пишутся с большой буквы</b>.</p><p><b>Wie heißt das auf Deutsch?</b> — Как это по-немецки?</p>'),
 ].concat(NOUNS.map(function(x){return L(x[0]+' '+x[1],x[2])})).concat([
  GEN('art',{n:10}),
  GEN('artType',{n:5}),
  C('Как правильно?',['das Buch','der Buch','die Buch'],'das Buch',{sayAnswer:'das Buch',explain:'das Buch — средний род, хотя «книга» по-русски женского.'}),
  C('Как правильно?',['die Schere','der Schere','das Schere'],'die Schere',{sayAnswer:'die Schere'}),
  D('Wie heißt das auf Deutsch?','Wie heißt das auf Deutsch?','Как это по-немецки?')
 ])},
 {id:'u2l7',title:'ein, eine, mein, dein',items:[
  RULE('Неопределённый артикль и «мой / твой»','<p>Когда говоришь «это какой-то предмет», вместо der/das/die ставят <b>ein</b> или <b>eine</b>:</p><div class="ex"><span class="art-der">der</span> Kuli → <b>ein</b> Kuli → <b>mein</b> Kuli → <b>dein</b> Kuli<br><span class="art-das">das</span> Buch → <b>ein</b> Buch → <b>mein</b> Buch → <b>dein</b> Buch<br><span class="art-die">die</span> Schere → <b>eine</b> Schere → <b>meine</b> Schere → <b>deine</b> Schere</div><p>Правило одно: у слов с <span class="art-die">die</span> на конце появляется <span class="hl">-e</span>.</p><div class="ex"><b>Was ist das?</b> — Что это?<br><b>Ist das ein Bleistift?</b> — Это карандаш?<br><b>Nein, das ist ein Kuli. Das ist mein Kuli.</b> — Нет, это ручка. Это моя ручка.</div>'),

  GEN('ein',{n:6}),
  GEN('mein',{n:4,w:'mein'}),
  GEN('mein',{n:2,w:'dein'}),
  O('Собери: «Это мой карандаш.»','Das ist mein Bleistift.'),
  O('Собери: «Это ластик?»','Ist das ein Radiergummi?'),

 ]},

 {id:'u3l1',title:'Животные и их артикли',items:[
  RULE('Животные — тоже с артиклем','<p>Как и со школьными вещами, животное учим сразу с артиклем. Род часто не такой, как в русском:</p><div class="ex"><span class="art-der">der</span> Hund — собака (в русском женский род)<br><span class="art-die">die</span> Spinne — паук (в русском мужской)<br><span class="art-das">das</span> Pferd — лошадь<br><span class="art-das">das</span> Kaninchen — кролик</div><p>Слова на <b>-chen</b> всегда <span class="art-das">das</span>: das Kaninchen, das Meerschweinchen.</p><div class="ex"><b>Was ist dein Lieblingstier?</b> — Какое твоё любимое животное?<br><b>Mein Lieblingstier ist der Tiger.</b> — Моё любимое животное — тигр.<br><b>Das Haustier</b> — домашнее животное.</div>'),

 {id:'u3l2',title:'Hast du ein Haustier?',items:[
  RULE('Глагол haben — «иметь»','<p>По-русски «у меня есть», по-немецки «я имею»: <b>Ich habe eine Katze.</b> — У меня есть кошка.</p><div class="tablewrap"><table><tr><td>ich habe</td><td>wir haben</td></tr><tr><td>du <b>hast</b></td><td>ihr habt</td></tr><tr><td>er/sie/es <b>hat</b></td><td>sie/Sie haben</td></tr></table></div><p>Внимание: <b>du hast</b> и <b>er hat</b> — без буквы b.</p><div class="ex"><b>Hast du ein Haustier?</b> — У тебя есть домашнее животное?<br><b>Ja, ich habe eine Katze.</b> — Да, у меня есть кошка.</div><p>Возраст говорят через <b>sein</b> + <b>Jahre alt</b>:</p><div class="ex"><b>Wie alt bist du?</b> — Сколько тебе лет?<br><b>Ich bin zwölf Jahre alt.</b> — Мне 12 лет.<br><b>Er ist ein Jahr alt.</b> — Ему один год.</div>'),

 ]},
 {id:'u3l3',title:'einen и keinen',items:[
  RULE('Ich habe einen Hund','<p>После <b>haben</b> артикль у слов с <span class="art-der">der</span> меняется: <b>ein → einen</b>. У das и die ничего не меняется.</p><div class="tablewrap"><table><tr><th></th><th>Это …</th><th>У меня есть …</th><th>У меня нет …</th></tr><tr><td class="art-der">der Hund</td><td>Das ist ein Hund.</td><td>Ich habe ein<span class="hl">en</span> Hund.</td><td>Ich habe kein<span class="hl">en</span> Hund.</td></tr><tr><td class="art-das">das Pferd</td><td>Das ist ein Pferd.</td><td>Ich habe ein Pferd.</td><td>Ich habe kein Pferd.</td></tr><tr><td class="art-die">die Katze</td><td>Das ist eine Katze.</td><td>Ich habe eine Katze.</td><td>Ich habe keine Katze.</td></tr><tr><td>die Katzen (много)</td><td>Das sind Katzen.</td><td>Ich habe Katzen.</td><td>Ich habe keine Katzen.</td></tr></table></div><p><b>kein</b> — это «нет, никакой». По-русски «у меня нет собаки», по-немецки «я имею никакую собаку»: <b>Ich habe keinen Hund.</b></p><p>Запомни коротко: только мужской род получает <span class="hl">-en</span>.</p>'),
  L('Ich habe einen Hund.','У меня есть собака.'),L('Ich habe keinen Hund.','У меня нет собаки.'),L('Ich habe kein Haustier.','У меня нет домашнего животного.'),L('Ich habe keine Katze.','У меня нет кошки.'),
  GEN('akk',{n:6,w:'ein'}),

  O('Собери: «У меня нет собаки.»','Ich habe keinen Hund.'),
  O('Собери: «У тебя есть кролик?»','Hast du ein Kaninchen?'),
  T('Напиши по-немецки: «У меня есть попугай.»','Ich habe einen Papagei.',{kb:true,explain:'der Papagei → einen Papagei.'}),
  T('Напиши по-немецки: «У меня нет кошки.»','Ich habe keine Katze.',{kb:true}),

 ]},
 {id:'u3l4',title:'Много животных',items:[
  RULE('Множественное число','<p>Во множественном числе артикль всегда <span class="art-die"><b>die</b></span> — у всех слов.</p><p>А окончание у каждого слова своё, поэтому его учат вместе со словом:</p><div class="ex">der Hund → die Hund<span class="hl">e</span><br>das Pferd → die Pferd<span class="hl">e</span><br>der Tiger → die Tiger (не меняется)<br>der Hamster → die Hamster (не меняется)<br>das Lama → die Lama<span class="hl">s</span> · das Känguru → die Känguru<span class="hl">s</span><br>die Spinne → die Spinne<span class="hl">n</span> · die Schildkröte → die Schildkröte<span class="hl">n</span><br>die Maus → die M<span class="hl">ä</span>us<span class="hl">e</span> · die Kuh → die K<span class="hl">ü</span>h<span class="hl">e</span> · der Wolf → die W<span class="hl">ö</span>lf<span class="hl">e</span></div><p>В последних трёх появляются точки: a → ä, u → ü, o → ö.</p><p>Совет из учебника: на карточке пиши так — <b>die Maus, -¨e</b> — значит «die Mäuse».</p>'),
 ].concat(ANIMALS.filter(function(x){return x[3]}).map(function(x){return L(x[0]+' '+x[1]+' → die '+x[3],x[2]+' → много')})).concat([
  GEN('plural',{n:7}),
  C('Какой артикль у всех слов во множественном числе?',['die','der','das'],'die'),
  C('Как будет «мыши»?',['die Mäuse','die Mause','die Mäuser'],'die Mäuse',{sayAnswer:'die Mäuse'}),
  C('Как будет «тигры»?',['die Tiger','die Tigers','die Tigeren'],'die Tiger',{sayAnswer:'die Tiger'}),

 {id:'u3l5',title:'Какое оно? Цвета и описание',items:[
  RULE('Описать животное','<p>Вместо названия животного говорят «он / оно / она» — по артиклю, а не по-русски:</p><div class="ex"><span class="art-der">der</span> Tiger → <b>er</b> ist groß (он большой)<br><span class="art-das">das</span> Kaninchen → <b>es</b> ist lieb (оно милое)<br><span class="art-die">die</span> Katze → <b>sie</b> ist süß (она милашка)<br>die Mäuse → <b>sie sind</b> schnell (они быстрые)</div><p>Обрати внимание: про собаку (der Hund) говорят <b>er</b> — «он».</p><p>Слова-описания: <b>groß</b> — большой, <b>klein</b> — маленький, <b>stark</b> — сильный, <b>schnell</b> — быстрый, <b>lieb</b> — милый, добрый, <b>süß</b> — милый, сладкий, <b>alt</b> — старый.</p><p>Цвета: <b>rot</b> — красный, <b>blau</b> — синий, <b>grün</b> — зелёный, <b>gelb</b> — жёлтый, <b>schwarz</b> — чёрный, <b>weiß</b> — белый, <b>braun</b> — коричневый, <b>grau</b> — серый.</p><p>Континенты: <b>Afrika, Asien, Europa, Australien, Nordamerika, Südamerika, Antarktis</b>. <b>Woher kommt das Lama?</b> — <b>Ich glaube, das Lama kommt aus Südamerika.</b> (Я думаю…) Не знаешь — <b>Das weiß ich nicht.</b></p>'),

  L('groß','большой'),L('klein','маленький'),L('stark','сильный'),L('schnell','быстрый'),L('süß','милый'),

 {id:'u4l2',title:'Который час?',items:[
  RULE('Как говорят время','<p>Вопрос: <b>Wie viel Uhr ist es?</b> или <b>Wie spät ist es?</b> Ответ начинается с <b>Es ist …</b></p><div class="ex">7:00 — <b>sieben Uhr</b><br>7:10 — <b>zehn nach sieben</b> (десять после семи)<br>7:15 — <b>Viertel nach sieben</b> (четверть после семи)<br>7:30 — <b>halb acht</b><br>7:40 — <b>zwanzig vor acht</b> (двадцать до восьми)<br>7:45 — <b>Viertel vor acht</b> (четверть до восьми)</div><p><b>nach</b> — после, <b>vor</b> — до, <b>Viertel</b> — четверть.</p><p>Главная ловушка — <b>halb</b>. <b>halb acht</b> — это 7:30, а не 8:30. Как по-русски «половина восьмого»: полпути к восьми.</p><p>Час дня: <b>ein Uhr</b>, но <b>Viertel nach eins</b>, <b>halb eins</b> (12:30).</p><p>«Во сколько?» — <b>um</b>: <b>um halb sieben</b> — в половине седьмого.</p>'),

 {id:'u4l3',title:'Дни недели. Школьный день Тимо',items:[
  RULE('Дни недели и «официальное» время','<div class="ex"><b>der Montag</b> — понедельник<br><b>der Dienstag</b> — вторник<br><b>der Mittwoch</b> — среда<br><b>der Donnerstag</b> — четверг<br><b>der Freitag</b> — пятница<br><b>der Samstag</b> — суббота<br><b>der Sonntag</b> — воскресенье<br><b>das Wochenende</b> — выходные</div><p>Все дни недели — <span class="art-der">der</span>. «В понедельник» — <b>am Montag</b>. «По понедельникам» — <b>montags</b>, с маленькой буквы.</p><p><b>von Montag bis Freitag</b> — с понедельника по пятницу.</p><p>В расписании и на вокзале время говорят по цифрам: 13:40 — <b>dreizehn Uhr vierzig</b>, 6:30 — <b>sechs Uhr dreißig</b>.</p><p><b>die Stunde</b> — урок или час. <b>der Stundenplan</b> — расписание уроков.</p>'),

  L('am Montag','в понедельник'),L('montags','по понедельникам'),L('von Montag bis Freitag','с понедельника по пятницу'),L('Am Samstag habe ich frei.','В субботу я свободна.'),L('der Stundenplan','расписание уроков'),

  R('Timos Schultag','Ich heiße Timo. Ich bin dreizehn Jahre alt und wohne in Heidelberg. Ich bin in Klasse 7d. Wir haben fünf Tage Schule: von Montag bis Freitag. Mein Wecker klingelt um halb sieben. Ich gehe um Viertel nach sieben aus dem Haus. Der Unterricht beginnt um Viertel vor acht. Wir haben sechs Stunden Unterricht, bis 12 Uhr 40, und dann eine Stunde Mittagspause. Am Nachmittag haben wir drei Stunden. Jede Unterrichtsstunde hat 45 Minuten. Um 16 Uhr ist die Schule zu Ende. Gegen 16 Uhr 45 bin ich zu Hause.','Текст из учебника, с. 38 (немного сокращён). aus dem Haus gehen — выходить из дома, zu Ende — закончилось, zu Hause — дома, gegen — около.'),

 {id:'u4l4',title:'Когда? Время суток и порядок слов',items:[
  RULE('um, am, von … bis, gegen','<div class="ex"><b>um</b> + часы: <b>um</b> acht Uhr — в восемь<br><b>am</b> + день: <b>am</b> Samstag — в субботу<br><b>von … bis</b>: <b>von</b> 12 <b>bis</b> 13 Uhr — с 12 до 13<br><b>gegen</b>: <b>gegen</b> 16 Uhr — около 16 часов</div><p>Время суток:</p><div class="ex"><b>am Morgen</b> / <b>morgens</b> — утром<br><b>am Vormittag</b> / <b>vormittags</b> — до обеда<br><b>am Mittag</b> / <b>mittags</b> — в полдень<br><b>am Nachmittag</b> / <b>nachmittags</b> — после обеда<br><b>am Abend</b> / <b>abends</b> — вечером<br><b>in der Nacht</b> / <b>nachts</b> — ночью</div><p>Главное правило немецкого предложения: <b>глагол всегда на втором месте</b>. Если предложение начинается со времени, подлежащее уходит за глагол:</p><div class="ex">Der Unterricht <u>beginnt</u> um acht.<br>Um acht <u>beginnt</u> der Unterricht.<br>Montags <u>habe</u> ich Musik.</div><p>Нельзя: <s>Um acht der Unterricht beginnt.</s></p>'),

  RULE('Чем ты занимаешься?','<p><b>Was ist dein Hobby?</b> — Какое у тебя хобби? <b>Mein Hobby ist Malen.</b></p><p><b>gern</b> (или <b>gerne</b>) значит «охотно». Так говорят «я люблю что-то делать»: глагол + <b>gern</b>.</p><div class="ex">Ich spiele <b>gern</b> Fußball. — Я люблю играть в футбол.<br>Ich schwimme <b>nicht gern</b>. — Я не люблю плавать.<br><b>Was machst du gern?</b> — Что ты любишь делать?</div><p>Сравни: <b>Ich mag Fußball.</b> — Я люблю футбол (сам футбол). <b>Ich spiele gern Fußball.</b> — Я люблю в него играть.</p>'),

 {id:'u5l2',title:'Глаголы, где меняется гласная',items:[
  RULE('fahren → du fährst','<p>У некоторых глаголов с <b>du</b> и <b>er/sie/es</b> меняется гласная в корне. Остальные формы обычные.</p><div class="tablewrap"><table><tr><th></th><th>a → ä</th><th>e → ie</th><th>e → ie</th><th>e → i</th><th>e → i</th></tr><tr><td>ich</td><td>fahre</td><td>sehe</td><td>lese</td><td>spreche</td><td>treffe</td></tr><tr><td>du</td><td>f<span class="hl">ä</span>hrst</td><td>s<span class="hl">ie</span>hst</td><td>l<span class="hl">ie</span>st</td><td>spr<span class="hl">i</span>chst</td><td>tr<span class="hl">i</span>ffst</td></tr><tr><td>er/sie/es</td><td>f<span class="hl">ä</span>hrt</td><td>s<span class="hl">ie</span>ht</td><td>l<span class="hl">ie</span>st</td><td>spr<span class="hl">i</span>cht</td><td>tr<span class="hl">i</span>fft</td></tr><tr><td>wir</td><td>fahren</td><td>sehen</td><td>lesen</td><td>sprechen</td><td>treffen</td></tr><tr><td>ihr</td><td>fahrt</td><td>seht</td><td>lest</td><td>sprecht</td><td>trefft</td></tr><tr><td>sie/Sie</td><td>fahren</td><td>sehen</td><td>lesen</td><td>sprechen</td><td>treffen</td></tr></table></div><p><b>fahren</b> — ехать, кататься; <b>sehen</b> — видеть, смотреть; <b>lesen</b> — читать; <b>sprechen</b> — говорить; <b>treffen</b> — встречать.</p><p>Запомни: гласная меняется <b>только с du и er/sie/es</b>.</p>'),

 {id:'u5l3',title:'Приставка уходит в конец',items:[
  RULE('aufstehen: Ich stehe um 7 Uhr auf','<p>У некоторых глаголов приставка <b>отрывается</b> и уходит в <b>конец предложения</b>:</p><div class="ex"><b>auf</b>stehen — вставать → Ich <u>stehe</u> um sieben <b>auf</b>.<br><b>fern</b>sehen — смотреть телевизор → Er <u>sieht</u> abends <b>fern</b>.<br><b>mit</b>kommen — пойти вместе → <u>Kommst</u> du <b>mit</b>?<br><b>ab</b>holen — заходить за кем-то → Ich <u>hole</u> dich um fünf <b>ab</b>.<br><b>an</b>fangen — начинаться → Der Film <u>fängt</u> um sechs <b>an</b>.</div><p>Глагол, как всегда, на втором месте, а приставка — в самом конце. Получается «рамка».</p><p>Ударение всегда на приставке: <b>AUF</b>stehen, <b>FERN</b>sehen.</p><p><b>anfangen</b> ещё и меняет гласную: du f<span class="hl">ä</span>ngst an, er f<span class="hl">ä</span>ngt an.</p>'),

 {id:'u5l5',title:'können: что ты умеешь',items:[
  RULE('Глагол können — «мочь, уметь»','<div class="tablewrap"><table><tr><td>ich <b>kann</b></td><td>wir können</td></tr><tr><td>du <b>kannst</b></td><td>ihr könnt</td></tr><tr><td>er/sie/es <b>kann</b></td><td>sie/Sie können</td></tr></table></div><p>Внимание: <b>ich kann</b> и <b>er kann</b> — одинаково, без окончания.</p><p>После <b>können</b> второй глагол стоит <b>в конце</b>, в словарной форме:</p><div class="ex">Ich <u>kann</u> gut <b>kochen</b>. — Я хорошо готовлю.<br><u>Kannst</u> du Einrad <b>fahren</b>? — Ты умеешь кататься на моноцикле?<br>Wir <u>können</u> schon ein bisschen Deutsch. — Мы уже немного знаем немецкий.</div><p>Насколько хорошо: <b>super</b> · <b>sehr gut</b> · <b>gut</b> · <b>ganz gut</b> · <b>ein bisschen</b> · <b>nicht so gut</b> · <b>nicht</b>.</p><p>Спросить разрешения: <b>Kann ich mitspielen?</b> — Можно мне поиграть с вами?</p>'),
  L('Ich kann gut singen.','Я хорошо пою.'),L('Ich kann nicht Ski fahren.','Я не умею кататься на лыжах.'),L('Kannst du kochen?','Ты умеешь готовить?'),L('Ja, ein bisschen.','Да, немножко.'),L('Kann ich mitspielen?','Можно мне поиграть с вами?'),L('Das macht nichts.','Ничего страшного.'),
  GEN('conj',{verbs:['können'],prons:[0,1,2,3,4,5],n:6}),

{n:6,title:'Meine Familie',ru:'Моя семья',pages:'с. 51–58',lessons:[
 {id:'u6l1',title:'Семья',items:[
  RULE('Кто есть кто','<div class="tablewrap"><table><tr><th>мужчины</th><th>женщины</th><th>вместе (мн. ч.)</th></tr><tr><td><span class="art-der">der</span> Vater — папа</td><td><span class="art-die">die</span> Mutter — мама</td><td>die Eltern — родители</td></tr><tr><td><span class="art-der">der</span> Bruder — брат</td><td><span class="art-die">die</span> Schwester — сестра</td><td>die Geschwister — братья и сёстры</td></tr><tr><td><span class="art-der">der</span> Opa — дедушка</td><td><span class="art-die">die</span> Oma — бабушка</td><td>die Großeltern — бабушка и дедушка</td></tr><tr><td><span class="art-der">der</span> Onkel — дядя</td><td><span class="art-die">die</span> Tante — тётя</td><td></td></tr><tr><td><span class="art-der">der</span> Cousin — двоюродный брат</td><td><span class="art-die">die</span> Cousine — двоюродная сестра</td><td></td></tr></table></div><p>Где кто на фото: <b>vorne</b> — впереди, <b>hinten</b> — сзади, <b>links</b> — слева, <b>rechts</b> — справа, <b>in der Mitte</b> — в середине.</p><p><b>Wer ist das?</b> — Кто это? <b>Hast du Geschwister?</b> — У тебя есть братья или сёстры?</p>'),
 ].concat(FAMILY.map(function(x){return L((x[3]==='pl'?'die':x[0])+' '+x[1],x[2])})).concat([
  L('vorne / hinten','впереди / сзади'),L('links / rechts','слева / справа'),L('in der Mitte','в середине'),L('Wer ist das da vorne rechts?','Кто это там впереди справа?'),L('Hast du Geschwister?','У тебя есть братья или сёстры?'),
  GEN('art',{n:6,list:'family'}),
  C('«die Geschwister» — это…',['братья и сёстры','родители','бабушка и дедушка'],'братья и сёстры',{sayAnswer:'die Geschwister'}),
  C('«die Großeltern» — это…',['бабушка и дедушка','родители','дядя и тётя'],'бабушка и дедушка',{sayAnswer:'die Großeltern'}),
  C('«hinten links» — это…',['сзади слева','впереди справа','в середине'],'сзади слева'),
  C('Послушай. Кто это?',['тётя','бабушка','двоюродная сестра'],'тётя',{say:'die Tante',hide:true}),

  R('Familienfoto','Jan: Wer ist das da vorne rechts?\nMia: Das ist meine Cousine. Sie heißt Anke.\nJan: Und der Mann hinten links ist dein Vater?\nMia: Ja, genau. Und hinten in der Mitte steht mein Onkel.\nJan: Hast du noch Geschwister?\nMia: Ja, eine Schwester. Sie wohnt nicht zu Hause. Sie studiert schon.\nJan: Wie alt ist sie?\nMia: 19. Ich habe auch noch einen Cousin. Er ist 16.','Диалог из учебника, с. 52 (сокращён, имена добавлены). genau — точно, studieren — учиться в университете.'),
  C('Кто стоит впереди справа?',['двоюродная сестра Анке','папа','дядя'],'двоюродная сестра Анке',{ctx:1}),

  F('Напиши о своей семье: «Ich habe …» (например, сколько у тебя братьев и сестёр)',/^ich habe .+/i,'Ich habe einen Bruder und zwei Schwestern.')
 ])},
 {id:'u6l2',title:'sein, ihr, unser: чей?',items:[
  RULE('Притяжательные слова','<p>«Мой, твой, его, её…» зависят от того, <b>чей</b> предмет, а окончание — от артикля предмета:</p><div class="tablewrap"><table><tr><th>чей</th><th>der Vater, das Hobby</th><th>die Mutter, die Eltern</th></tr><tr><td>ich — мой</td><td>mein</td><td>mein<span class="hl">e</span></td></tr><tr><td>du — твой</td><td>dein</td><td>dein<span class="hl">e</span></td></tr><tr><td>er, es — его</td><td><b>sein</b></td><td>sein<span class="hl">e</span></td></tr><tr><td>sie — её</td><td><b>ihr</b></td><td>ihr<span class="hl">e</span></td></tr><tr><td>wir — наш</td><td>unser</td><td>unser<span class="hl">e</span></td></tr><tr><td>ihr — ваш (друзьям)</td><td>euer</td><td><b>eure</b></td></tr><tr><td>sie — их / Sie — Ваш</td><td>ihr / Ihr</td><td>ihr<span class="hl">e</span> / Ihr<span class="hl">e</span></td></tr></table></div><p>Правило как у mein: с <span class="art-die">die</span> и во множественном числе на конце <span class="hl">-e</span>.</p><p>Ловушка: <b>ihr</b> значит и «её», и «их». А <b>sein</b> — это и «быть», и «его».</p><div class="ex">Bert hat einen Hund. <b>Sein</b> Hund heißt Puppi.<br>Bina mag Mode. <b>Ihr</b> Hobby ist Schminken.<br>Das sind <b>unsere</b> Großeltern.</div><p>По-русски «свой» подходит всем, а по-немецки надо выбрать: <b>seine</b> Mutter (если он) или <b>ihre</b> Mutter (если она).</p>'),
  L('Sein Hobby ist Radfahren.','Его хобби — велосипед.'),L('Ihr Hobby ist Kochen.','Её хобби — готовка.'),L('Das sind unsere Großeltern.','Это наши бабушка и дедушка.'),L('Wie heißt eure Mutter?','Как зовут вашу маму?'),
  GEN('poss',{n:12}),
  C('Bina (sie) hat einen Bruder. ___ Bruder heißt Bert.',['Ihr','Sein','Ihre'],'Ihr',{explain:'Бина — она → ihr. der Bruder → без -e.'}),
  C('Bert (er) hat eine Schwester. ___ Schwester heißt Bina.',['Seine','Sein','Ihre'],'Seine',{explain:'Берт — он → sein; die Schwester → seine.'}),
  R('Berts Bruder erzählt','Vorne rechts steht mein Bruder, er heißt Bert und ist 18 Jahre alt. Sein Hobby ist Radfahren. Meine Schwester Bina sitzt vorne links. Sie ist 15 und mag Mode und Schminken. In der Mitte sitzen unsere Oma und unser Opa, sie sind beide 65. Meine Mutter steht hinten links. Ihr Hobby ist Kochen. Der Mann hinten rechts ist mein Vater. Unser Hund Puppi ist auch auf dem Bild. Er ist so lieb.','Текст из учебника, с. 53 (сокращён). beide — оба, auf dem Bild — на картинке.'),
  C('Какое хобби у Берта?',['Radfahren','Kochen','Schminken'],'Radfahren',{ctx:1}),
  C('Сколько лет бабушке и дедушке?',['65','18','15'],'65',{ctx:1}),
  C('Кто стоит сзади слева?',['мама','папа','Бина'],'мама',{ctx:1}),
  O('Собери: «Его хобби — велосипед.»','Sein Hobby ist Radfahren.'),
  O('Собери: «Это наши бабушка и дедушка.»','Das sind unsere Großeltern.'),
  T('Напиши по-немецки: «Её брат живёт в Берлине.»','Ihr Bruder wohnt in Berlin.',{kb:true})
 ]},
 {id:'u6l3',title:'Чьё это? Papas Rucksack',items:[
  RULE('Чей? Через -s','<p>Чтобы сказать «рюкзак папы», «книга Сильке», к имени добавляют <b>-s</b> и ставят его <b>впереди</b>:</p><div class="ex">das Buch von Silke → <b>Silkes</b> Buch<br>der Rucksack von Papa → <b>Papas</b> Rucksack<br>das Hobby von Paul → <b>Pauls</b> Hobby<br>die Tasche von Charlotte → <b>Charlottes</b> Tasche</div><p>Апостроф не нужен! Не <s>Silke&#39;s</s>, а <b>Silkes</b>.</p><p>Если имя уже кончается на <b>-s</b>, <b>-ß</b>, <b>-x</b> или <b>-z</b>, ставят только апостроф: <b>Lukas&#39; Zimmer</b>, <b>Markus&#39; Schwester</b>.</p>'),
  L('Das ist Silkes Buch.','Это книга Сильке.'),L('Das ist Papas Rucksack.','Это папин рюкзак.'),L('Lukas\' Zimmer','комната Лукаса'),L('Was ist denn hier los?','Что тут происходит?'),L('Ich weiß es nicht.','Я не знаю.'),
  C('Как сказать «тетрадь Леона»?',['Leons Heft','Leon\'s Heft','Heft Leons'],'Leons Heft',{sayAnswer:'Leons Heft'}),
  C('Как сказать «комната Лукаса»?',['Lukas\' Zimmer','Lukass Zimmer','Lukas Zimmers'],'Lukas\' Zimmer'),
  G('часы Сары','___ Uhr','Sarahs'),
  G('фото Мартина','___ Foto','Martins'),
  G('очки дедушки','___ Brille','Opas'),
  G('планшет папы','___ Tablet','Papas'),
  G('велосипед мамы','___ Fahrrad','Mamas'),
  T('Напиши по-немецки: «Это сумка Марии.» (die Tasche)','Das ist Marias Tasche.',{kb:true}),
  R('Chaos im Zimmer','Mutter: Was ist denn hier los? Julian, ist das dein Deutschbuch?\nJulian: Nein, das ist Silkes Buch. Mein Buch ist da.\nMutter: Und wo ist deine Schultasche?\nJulian: Meine Schultasche? Ich weiß es nicht.\nMutter: Du weißt es nicht!! Und wo ist Silke? Ist das ihr Rucksack?\nJulian: Nein. Das ist Papas Rucksack. Silkes Rucksack liegt da.','Диалог из учебника, с. 54. liegen — лежать, das Chaos — беспорядок.'),
  C('Чья это книга?',['Сильке','Юлиана','папы'],'Сильке',{ctx:1}),
  C('Где школьная сумка Юлиана?',['он не знает','на столе','у Сильке'],'он не знает',{ctx:1}),
  C('Чей это рюкзак?',['папин','Сильке','мамин'],'папин',{ctx:1}),
  G('Юлиан, это твоя школьная сумка?','Julian, ist das ___ Schultasche?','deine'),
  G('Это её рюкзак? (Сильке)','Ist das ___ Rucksack?','ihr')
 ]},
 {id:'u6l4',title:'Профессии',items:[
  RULE('Was ist deine Mutter von Beruf?','<p>Профессия — <b>der Beruf</b>. Вопрос: <b>Was ist dein Vater von Beruf?</b> — Кем работает твой папа?</p><p>Ответ <b>без артикля</b>: <b>Er ist Lehrer.</b> (не «ein Lehrer»). <b>Meine Mutter ist Ingenieurin.</b></p><p>Женская форма почти всегда: + <span class="hl">-in</span> и артикль <span class="art-die">die</span>:</p><div class="ex"><span class="art-der">der</span> Lehrer → <span class="art-die">die</span> Lehrer<span class="hl">in</span><br>der Verkäufer → die Verkäufer<span class="hl">in</span><br>der Polizist → die Polizist<span class="hl">in</span><br>der Pilot → die Pilot<span class="hl">in</span></div><p>Иногда появляются точки: der <b>A</b>rzt → die <b>Ä</b>rztin, der K<b>o</b>ch → die K<b>ö</b>chin.</p><p>Мечта: <b>Mein Traumberuf ist Pilotin.</b> — Профессия моей мечты — пилот.</p>'),
 ].concat(JOBS.map(function(x){return L('der '+x[0]+' / die '+x[1],x[2])})).concat([
  L('Was ist deine Mutter von Beruf?','Кем работает твоя мама?'),L('Meine Mutter ist Ingenieurin.','Моя мама — инженер.'),L('Mein Traumberuf ist Koch.','Профессия моей мечты — повар.'),
  GEN('fem',{n:6}),
  C('«der Tierarzt» — это…',['ветеринар','зубной врач','врач'],'ветеринар',{sayAnswer:'der Tierarzt'}),
  C('«der Verkäufer» — это…',['продавец','полицейский','учитель'],'продавец',{sayAnswer:'der Verkäufer'}),
  C('«die Informatikerin» — это…',['программистка','секретарь','архитектор'],'программистка'),
  C('Как правильно?',['Mein Vater ist Lehrer.','Mein Vater ist ein Lehrer von Beruf.','Mein Vater Lehrer.'],'Mein Vater ist Lehrer.',{explain:'Профессию говорят без артикля.'}),
  G('Моя мама — продавщица.','Meine Mutter ist ___.','Verkäuferin',{kb:true}),
  G('Кем работает твой папа?','Was ist dein Vater von ___?','Beruf'),
  O('Собери: «Профессия моей мечты — фотограф.»','Mein Traumberuf ist Fotograf.'),
  T('Напиши по-немецки: «Мой папа — врач.»','Mein Vater ist Arzt.',{kb:true}),
  T('Напиши по-немецки: «учительница»','Lehrerin',{kb:true}),
  R('Traumberufe','Ich kann gut Tennis spielen. Mein Traumberuf ist Tennisspielerin!\n\nIch kann gut kochen und esse gern. Mein Traumberuf ist Koch.','Из учебника, с. 57. essen — есть, кушать.'),
  F('Какая профессия твоей мечты? «Mein Traumberuf ist …»',/^mein traumberuf ist \S+/i,'Mein Traumberuf ist Malerin.')
 ])},

{n:7,title:'Was kostet das?',ru:'Сколько это стоит?',pages:'с. 59–69',lessons:[
 {id:'u7l1',title:'На киоске',items:[
  RULE('Покупки на киоске','<p>Киоск (<b>der Kiosk</b>) в Германии — маленький магазинчик: газеты, журналы, сладости, напитки.</p><p>Как попросить:</p><div class="ex"><b>Ich hätte gerne Kaugummis.</b> — Мне жвачку, пожалуйста. (очень вежливо)<br><b>Ich möchte einen Schokoriegel.</b> — Я хочу шоколадный батончик.<br><b>Ich nehme die Gummibärchen.</b> — Я возьму мармеладных мишек.</div><p>Продавец спросит: <b>Noch etwas?</b> — Что-нибудь ещё? Ответ: <b>Nein, das ist alles.</b> — Нет, это всё.</p><p>Цена: <b>Was kostet das?</b> — Сколько это стоит? <b>Das macht zusammen 1 Euro 45.</b> — Всего 1 евро 45.</p><p>Если товара нет: <b>Tut mir leid, das habe ich leider nicht.</b> — К сожалению, этого нет.</p>'),
 ].concat(KIOSK.map(function(x){return L(x[0]+' '+x[1]+(x[3]&&x[3]!==x[1]?' → die '+x[3]:''),x[2])})).concat([
  L('Ich hätte gerne Kaugummis.','Мне жвачку, пожалуйста.'),L('Noch etwas?','Что-нибудь ещё?'),L('Nein, das ist alles.','Нет, это всё.'),L('Was kostet das?','Сколько это стоит?'),L('Tut mir leid.','Мне жаль.'),
  GEN('art',{n:8,list:'kiosk'}),
  C('«die Zeitschrift» — это…',['журнал','газета','открытка'],'журнал',{sayAnswer:'die Zeitschrift'}),
  C('«der Schokoriegel» — это…',['шоколадный батончик','жвачка','пакетик'],'шоколадный батончик',{sayAnswer:'der Schokoriegel'}),
  C('Продавец спрашивает «Noch etwas?». Тебе больше ничего не нужно. Что ответишь?',['Nein, das ist alles.','Ja, gerne.','Tut mir leid.'],'Nein, das ist alles.'),
  R('Am Kiosk','Mädchen: Guten Tag, ich hätte gerne Kaugummis. Was kosten die?\nVerkäuferin: Die Kaugummis kosten 1 Euro 50.\nMädchen: 1 Euro 50? Die sind aber teuer. Und was kosten die Gummibärchen?\nVerkäuferin: Die kosten 75 Cent.\nMädchen: Dann nehme ich die und einen Schokoriegel. Was kosten die Schokoriegel?\nVerkäuferin: Der kostet 70 Cent und der 90 Cent.\nMädchen: Dann nehme ich den da.\nVerkäuferin: Noch etwas?\nMädchen: Nein, das ist alles. Was kostet das?\nVerkäuferin: Das macht zusammen 1 Euro 45. Das sind 2 Euro, und 55 Cent zurück.\nMädchen: Danke, tschüs.','Диалог из учебника, с. 60. teuer — дорогой, dann — тогда, zusammen — вместе, zurück — сдача.'),
  C('Сколько стоят жвачки?',['1 Euro 50','75 Cent','55 Cent'],'1 Euro 50',{ctx:1}),
  C('Почему девочка не берёт жвачки?',['они дорогие','их нет','она их не любит'],'они дорогие',{ctx:1}),
  C('Сколько она платит всего?',['1 Euro 45','2 Euro','90 Cent'],'1 Euro 45',{ctx:1}),
  C('Сколько ей дают сдачи?',['55 Cent','45 Cent','75 Cent'],'55 Cent',{ctx:1}),
  O('Собери: «Мне жвачку, пожалуйста.»','Ich hätte gerne Kaugummis.'),
  T('Напиши по-немецки: «Сколько это стоит?»','Was kostet das?',{kb:true}),
  T('Напиши по-немецки с артиклем: «журнал»','die Zeitschrift',{kb:true})
 ])},
 {id:'u7l2',title:'Цены. den da, die da',items:[
  RULE('Как говорят цены','<div class="ex">1,50 € — <b>ein Euro fünfzig</b><br>0,75 € — <b>fünfundsiebzig Cent</b><br>3,99 € — <b>drei Euro neunundneunzig</b><br>5,00 € — <b>fünf Euro</b></div><p>Слово «Cent» после евро обычно не говорят: «zwei Euro zwanzig». В записи вместо точки — запятая: 1,50 €.</p><p>Одна вещь — <b>kostet</b>, несколько — <b>kosten</b>:</p><div class="ex">Der Comic <b>kostet</b> 3,99 €.<br>Die Kaugummis <b>kosten</b> 1,50 €.</div><p>Показать «вот этот» — артикль + <b>da</b>:</p><div class="ex"><span class="art-der">der</span> Kaugummi → Ich nehme <b>den da</b>. (der → den, как einen)<br><span class="art-das">das</span> Heft → Ich nehme <b>das da</b>.<br><span class="art-die">die</span> Zeitschrift → Ich nehme <b>die da</b>.</div><p><b>teuer</b> — дорогой, <b>billig</b> — дешёвый.</p>'),
  L('Das ist aber teuer!','Ну это дорого!'),L('Das ist billig.','Это дёшево.'),L('Ich nehme den da.','Я возьму вот этот.'),L('Was kosten die Filzstifte?','Сколько стоят фломастеры?'),
  GEN('priceHear',{n:6}),
  GEN('priceRead',{n:4}),
  C('Der Comic ___ 3,99 €.',['kostet','kosten'],'kostet'),
  C('Die Filzstifte ___ 1,95 €.',['kosten','kostet'],'kosten',{explain:'Фломастеров много → kosten.'}),
  C('der Kaugummi: Ich nehme ___ da.',['den','der','die'],'den',{explain:'der → den после nehmen.'}),
  C('die Zeitschrift: Ich nehme ___ da.',['die','den','das'],'die'),
  C('das Heft: Ich nehme ___ da.',['das','den','die'],'das'),
  C('«billig» — это…',['дешёвый','дорогой','красивый'],'дешёвый'),
  G('Это дорого!','Das ist aber ___!','teuer'),
  O('Собери: «Сколько стоит комикс?»','Was kostet der Comic?'),
  T('Напиши по-немецки: «Я возьму вот этот.» (der Kaugummi)','Ich nehme den da.',{kb:true}),
  R('ei, au, eu','ei: eins, zwei, drei, der Preis, die Zeitschrift, einkaufen, ich weiß nicht\nau: kaufen, tausend, auch, der Kaugummi, die Pause, zu Hause\neu, äu: neun, Euro, teuer, Deutsch, der Freund, der Verkäufer','Фонетика, с. 61. ei читается «ай», au — «ау», eu и äu — «ой». Послушай и прочитай вслух.'),
  C('Как читается «teuer»?',['тойер','теуер','тауер'],'тойер',{sayAnswer:'teuer'}),
  C('Как читается «Preis» (цена)?',['прайс','прейс','прис'],'прайс',{sayAnswer:'der Preis'})
 ]},
 {id:'u7l3',title:'möchte: что ты хочешь',items:[
  RULE('Глагол möchten — «хотел бы»','<div class="tablewrap"><table><tr><td>ich <b>möchte</b></td><td>wir möchten</td></tr><tr><td>du <b>möchtest</b></td><td>ihr möchtet</td></tr><tr><td>er/sie/es <b>möchte</b></td><td>sie/Sie möchten</td></tr></table></div><p>Как у <b>können</b>: с <b>ich</b> и <b>er</b> форма одинаковая — <b>möchte</b>.</p><p>После möchte — как после haben: <span class="art-der">der</span> → <b>einen</b>:</p><div class="ex">Ich möchte <b>einen</b> Hund. (der Hund)<br>Ich möchte <b>ein</b> Fahrrad. (das Fahrrad)<br>Ich möchte <b>eine</b> Katze. (die Katze)</div><p><b>zum Geburtstag</b> — на день рождения: <b>Was möchtest du zum Geburtstag?</b></p><p>Второй глагол, если он есть, уходит в конец: <b>Möchtest du einen Comic lesen?</b></p>'),
  L('Was möchtest du zum Geburtstag?','Что ты хочешь на день рождения?'),L('Ich möchte gerne ein Fahrrad.','Я бы хотела велосипед.'),L('Adi möchte einen Hund.','Ади хочет собаку.'),L('der Geburtstag','день рождения'),L('Meine Geburtstagswünsche','Мои желания на день рождения'),
  GEN('conj',{verbs:['möchten'],prons:[0,1,2,3,4,5],n:6}),
  GEN('akk',{n:4,w:'ein',verb:'möchte',list:'kiosk'}),
  G('Что ты хочешь на день рождения?','Was ___ du zum Geburtstag?','möchtest',{kb:true}),
  G('Моя сестра тоже хочет собаку.','Meine Schwester ___ auch einen Hund.','möchte',{kb:true}),
  G('Я хочу велосипед.','Ich möchte ___ Fahrrad.','ein'),
  G('Я хочу комикс. (der Comic)','Ich möchte ___ Comic.','einen'),
  R('Geburtstagswünsche','Adi: Was möchtest du gerne zum Geburtstag, Pia?\nPia: Ich möchte gerne ein Fahrrad, du auch?\nAdi: Nein, ich habe ein Fahrrad. Ich möchte gerne einen Hund.\nPia: Echt? Meine Schwester möchte auch einen Hund. Und was möchtest du noch?\nAdi: Dann möchte ich noch ein Computerspiel.','Диалог из учебника, с. 63 (окончание добавлено). Echt? — Правда? noch — ещё.'),
  C('Что хочет Пиа?',['велосипед','собаку','компьютерную игру'],'велосипед',{ctx:1}),
  C('Почему Ади не хочет велосипед?',['у него уже есть','он дорогой','он не умеет кататься'],'у него уже есть',{ctx:1}),
  C('Кто ещё хочет собаку?',['сестра Пии','мама Ади','Пиа'],'сестра Пии',{ctx:1}),
  O('Собери: «Что ты хочешь на день рождения?»','Was möchtest du zum Geburtstag?'),
  T('Напиши по-немецки: «Я бы хотела собаку.»',['Ich möchte einen Hund.','Ich möchte gerne einen Hund.','Ich möchte gern einen Hund.'],{kb:true}),
  F('Напиши своё желание на день рождения: «Ich möchte …»',/^ich möchte .+/i,'Ich möchte ein Tablet.')
 ]},
 {id:'u7l4',title:'Карманные деньги: nehmen, geben',items:[
  RULE('nehmen, geben и ausgeben','<p>Ещё два глагола, где меняется гласная (e → i), как у sprechen:</p><div class="tablewrap"><table><tr><th></th><th>nehmen — брать</th><th>geben — давать</th><th>arbeiten — работать</th></tr><tr><td>ich</td><td>nehme</td><td>gebe</td><td>arbeite</td></tr><tr><td>du</td><td>n<span class="hl">imm</span>st</td><td>g<span class="hl">i</span>bst</td><td>arbeit<span class="hl">e</span>st</td></tr><tr><td>er/sie/es</td><td>n<span class="hl">imm</span>t</td><td>g<span class="hl">i</span>bt</td><td>arbeit<span class="hl">e</span>t</td></tr><tr><td>wir</td><td>nehmen</td><td>geben</td><td>arbeiten</td></tr><tr><td>ihr</td><td>nehmt</td><td>gebt</td><td>arbeitet</td></tr><tr><td>sie/Sie</td><td>nehmen</td><td>geben</td><td>arbeiten</td></tr></table></div><p>У <b>arbeiten</b> корень кончается на -t, поэтому вставляется <b>e</b>: du arbeit<b>e</b>st — иначе не выговорить.</p><p><b>ausgeben</b> — тратить, приставка уходит в конец: <b>Ich gebe viel Geld für Kino aus.</b> — Я трачу много денег на кино.</p><p><b>das Taschengeld</b> — карманные деньги, <b>bekommen</b> — получать, <b>pro Monat</b> — в месяц, <b>pro Woche</b> — в неделю.</p><p>Мнение: <b>Ich finde das gut / blöd.</b> <b>Das macht Spaß / keinen Spaß.</b> — Это весело / невесело.</p>'),

    var cl=app.querySelector('[data-act="clear"]');if(cl)cl.onclick=function(){if(S.answered)return;S.picked=[];app.querySelectorAll('[data-tile]').forEach(function(b){b.classList.remove('used')});drawTarget()};

function answersOf(it){
  if(it.t==='conj')return[VERBS[it.v].f[it.p]];
  if(it.t==='num')return it.mode==='hear'?[String(it.n)]:numVariants(it.n);
  if(it.t==='order')return[it.a];
  return(it.a||[]).concat(it.alt||[]);
}
function deText(it){ /* the German to speak after answering */
  if(it.sayAnswer)return it.sayAnswer;
  if(it.t==='gap')return it.s.replace('___',it.a[0]);
  if(it.t==='conj')return(it.shown==='Sie'?'Sie':it.shown)+' '+VERBS[it.v].f[it.p];
  if(it.t==='art')return it.a+' '+it.w;
  if(it.t==='num')return numDe(it.n);
  if(it.t==='listen'&&it.dec)return it.say;
  if(it.t==='type'||it.t==='listen')return it.digits?null:it.a[0];
  if(it.t==='order')return it.a;
  if(it.t==='choice'&&it.say)return it.say;
  if(it.t==='choice'&&!hasCyr(it.a)&&!/^\d/.test(it.a))return it.a;
  return null;
}
function submit(){
  if(S.answered){next();return}
  var it=S.cur,inp=document.getElementById('ans');
  if(it.t==='free'){
    var v=norm(inp.value);if(!v)return;
    var ok=it.re.test(v.replace(/ss/g,'ß'))||it.re.test(v);
    S.answered=true;
    sheet(ok?'ok':'warn',ok?'Отлично!':'Принято',ok?'Проверь сама: имена и существительные — с большой буквы, глагол на втором месте.':'Попробуй начать так, как в примере: '+it.example,null);
    say(inp.value);return;
  }
  if(it.t==='order'){
    if(!S.picked.length)return;
    var built=S.picked.map(function(k){return S.tiles[k].w}).join(it.join?'':' ');
    var good=norm(built)===norm(it.a);
    return grade(good);
  }
  if(!inp||!norm(inp.value))return;
  var r=check(inp.value,answersOf(it));
  inp.classList.add(r.res==='ok'?'ok':'no');
  grade(r.res==='ok',r.msg);
}
function grade(ok,msg,forceMsg){
  var it=S.cur;S.answered=true;
  var first=!it._retry&&!it._rev;
  if(ok){if(first)S.right++;if(S.mist||it._rev)removeMistake(it)}
  else{
    if(first){S.wrongs.push(it);addMistake(it)}
    var n=it._n||0;
    if(n<2){var c1=clone(strip(it));c1._retry=true;c1._n=n+1;S.items.splice(S.i+1,0,c1);
      if(n===0){var c2=clone(strip(it));c2._retry=true;c2._n=1;S.items.splice(Math.min(S.items.length,S.i+5),0,c2)}}
  }
  var a=answersOf(it);
  var answer=it.t==='choice'?it.a:it.t==='art'?it.a+' '+it.w:(it.t==='conj'?(it.shown+' '+a[0]):a[0]);
  var de=deText(it);
  var explain=it.explain||'';
  if(it.t==='conj'){var v=VERBS[it.v];explain='Вся таблица: ich '+v.f[0]+', du '+v.f[1]+', er/sie '+v.f[2]+', wir '+v.f[3]+', ihr '+v.f[4]+', sie/Sie '+v.f[5]+'.'}
  if(it.t==='art'){explain=it.a+' '+it.w+' — '+(it.pl?'множественное число, всегда die':ARTRU[it.a])+'.'}
  var ru=trOf(it,de);if(!ru&&it.t!=='choice')ru=DICT[dk(answer)]||null;
  if(ru&&de&&dk(ru)===dk(de))ru=null;
  if(ru&&!ok&&dk(ru)===dk(answer))ru=null;
  sheet(ok?'ok':'bad',ok?'Верно!':'Пока не так',{answer:ok?null:(de&&dk(de)===dk(answer)?null:answer),de:de||(ok?null:null),ru:ru,why:explain,msg:[forceMsg,msg].filter(Boolean).join(' '),rule:RULES[it.lid],ok:ok,raw:(!de&&!ok)?answer:null});
  if(de)say(de);
  tick();
}
function sheet(kind,head,info,answer){
  var el=document.createElement('div');el.className='sheet '+kind;
  var h='<div class="in"><div class="head">'+esc(head)+'</div>';
  if(info&&typeof info==='object'){
    if(info.answer)h+='<div>Правильно: <span class="right">'+colorArt(info.answer)+'</span></div>';
    if(info.raw&&!info.answer)h+='<div>Правильно: <span class="right">'+colorArt(info.raw)+'</span></div>';
    if(info.de)h+='<div class="pairline"><button class="say mini" data-say="'+esc(info.de)+'" aria-label="Послушать">'+SPK+'</button><span class="right">'+colorArt(info.de)+'</span></div>';
    if(info.ru)h+='<div class="trline"><span class="lbl">Перевод</span> '+esc(info.ru)+'</div>';
    if(info.msg)h+='<div>'+esc(info.msg)+'</div>';
    if(info.why)h+='<div class="trline"><span class="lbl">Почему</span> '+esc(info.why)+'</div>';
    if(info.rule)h+='<details class="rulebox"><summary>Правило: '+esc(info.rule.title)+'</summary><div class="rule">'+info.rule.html+'</div></details>';
  }else{
    if(answer)h+='<div>Правильно: <span class="right">'+colorArt(answer)+'</span></div>';
    if(info)h+='<div>'+esc(info)+'</div>';
  }
  el.innerHTML=h+'<button class="btn wide" id="nextBtn">Дальше</button></div>';
  el.querySelectorAll('[data-say]').forEach(function(b){b.onclick=function(){say(b.dataset.say)}});

  if(!('ontouchstart' in window))nb.focus();
}

function finish(){
  tick();
  var l=S.lesson,pct=S.total?Math.round(S.right/S.total*100):100;
  if(!S.mist){var p=DB.progress[l.id]||{best:0};p.best=Math.max(p.best||0,pct);p.last=todayKey();DB.progress[l.id]=p}
  save();
  var nxt=null;
  if(!S.mist){var ix=PARTS.indexOf(l);nxt=PARTS[ix+1]||null}
  var h='<div class="stack" style="padding-top:20px"><div class="card"><div class="kind">'+(S.mist?'Работа над ошибками':(l.n>1&&l.k<l.n?'Часть пройдена':'Урок закончен'))+'</div><h2>'+esc(l.title)+'</h2>'
   +'<div class="result">'+pct+'%</div><div class="muted">С первого раза верно: '+S.right+' из '+S.total+'. Сегодня занималась '+minutesToday()+' мин.</div>';
  if(S.wrongs.length){h+='<div class="note"><b>Над чем поработать:</b><br>'+S.wrongs.slice(0,8).map(function(it){var a=answersOf(it)[0];var d=deText(it)||a;return esc(d)}).join('<br>')+'</div><div class="muted small">Эти задания сохранились в «Работе над ошибками».</div>'}
  h+='<div class="actions">'+(S.mist?'':'<button class="btn ghost" data-act="again">Ещё раз</button>')+(nxt?'<button class="btn" data-act="nextLesson">'+(nxt.lesson===l.lesson?'Дальше: часть '+nxt.k:'Следующий урок')+'</button>':'')+'</div><button class="btn ghost wide" data-act="home">К темам</button></div></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  var a=app.querySelector('[data-act="again"]');if(a)a.onclick=function(){start(l)};
  var n=app.querySelector('[data-act="nextLesson"]');if(n)n.onclick=function(){start(nxt)};
  app.querySelector('[data-act="home"]').onclick=home;
}
home();
cloudInit();
setTimeout(function(){if(cloudState==='checking'){cloudState='local';rerenderHome()}},12000);
})();
</script>
</body></html>
